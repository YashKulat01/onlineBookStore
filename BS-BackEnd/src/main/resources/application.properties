spring.application.name=BS-BackEnd
server.port=8082

#Database releated settings.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bookNext
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver

#=========================================

#Hibernate related settings
spring.jpa.hibernate.ddl-auto= update

#Shows the query run in sql
spring.jpa.show-sql= true

#Class for each type of rdbms
spring.jpa.properties.hibernate.dialects= org.hibernate.dialect.MySQLDialect